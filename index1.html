*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

main{padding:12px 14px;max-width:1300px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mut{color:var(--mut)}.note{background:var(--hol);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}

.ls{margin-bottom:4px}.ls small{display:block;color:var(--mut);font-size:12px}.cf{background:var(--warnbg);outline:1px solid var(--warn)}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}.day h3{margin:0;padding:6px 12px;font-size:14px;background:var(--bg);display:flex;justify-content:space-between}
.row{display:flex;gap:12px;padding:6px 12px;border-top:1px solid var(--line)}.row .tm{min-width:92px;color:var(--acc);font-weight:600;white-space:nowrap}
.badge{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--accbg);color:var(--acc)}a{color:var(--acc)}.win{color:var(--mut);font-size:13px}
.em{display:block;font-weight:400;font-size:12px;color:var(--mut);word-break:break-all;margin-top:2px}
@media (max-width:640px){
main{padding:10px}header{padding:8px 10px}h1{font-size:16px;margin-bottom:6px}
button,select,input{font-size:16px;padding:8px 12px}
.bar>*{flex:1 1 auto;min-width:0}#q,#tc,#cat,#par,#dt{flex:1 1 100%}
.wrap{border:0;background:none;overflow:visible}
table{min-width:0}table tr:first-child{display:none}
table,tbody,tr,td{display:block;width:100%}
tr{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding-bottom:4px;overflow:hidden}
td{border:0;padding:4px 12px}
td:first-child{position:static;min-width:0;background:var(--bg);padding:8px 12px;margin-bottom:2px}
td[data-t]::before{content:attr(data-t);display:block;color:var(--acc);font-weight:600;font-size:12px}
.row{flex-direction:column;gap:2px}
.day h3{flex-wrap:wrap;gap:4px}
}

const WD=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const HOL={'2026-11-04':'4 ноября — День народного единства, занятий нет','2026-12-31':'31 декабря — нерабочий день, занятий нет'};
const pad=n=>String(n).padStart(2,'0');
const isoU=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const toD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c))};
const START='2026-09-01',END='2026-12-31';
const n=new Date();let today=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());
const clamp=s=>s<START?START:s>END?END:s;
const st={tab:'day',date:clamp(today),tch:0,cat:'',q:'',all:false,from:'today',first:1};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dow=iso=>(toD(iso).getUTCDay()+6)%7;
const par=iso=>{const w=Math.floor((toD(iso)-toD('2026-11-16'))/604800000);return w%2===0?2:1}; // неделя 16–22.11.2026 = ПОД (2), соседние чередуются
const dstr=iso=>{const d=toD(iso);return WD[dow(iso)]+', '+d.getUTCDate()+' '+MON[d.getUTCMonth()]};
let IDX={};
function build(){IDX={};for(let d=toD(START);isoU(d)<=END;d=new Date(d.getTime()+864e5)){const iso=isoU(d);if(HOL[iso]){IDX[iso]=[];continue}
 const w=dow(iso),p=par(iso);IDX[iso]=L.filter(l=>l.ds?l.ds.includes(iso):(l.d===w&&(l.p===3||l.p===p)&&(!l.f||iso>=l.f)))}}
const on=(iso)=>IDX[iso]||[];
const catOk=i=>!st.cat||T[i].cats.includes(st.cat);
const pl=(iso)=>{const p=par(iso);return (dow(iso)===6)?'':' · неделя '+(p===1?'НАД':'ПОД')};
function lesson(l){return `<div class="ls">${esc(l.sub)}<small>${esc(l.g)}${l.r?' · ауд. '+esc(l.r):''}</small></div>`}
function viewDay(){
 const ls=on(st.date).filter(l=>catOk(l.t)&&T[l.t].name.toLowerCase().includes(st.q.toLowerCase()));
 const slots=[...new Set([540,640,760,860,960,...ls.map(l=>l.s)])].sort((a,b)=>a-b);
 let ids=[...new Set(ls.map(l=>l.t))];if(st.all)ids=T.map((_,i)=>i).filter(i=>catOk(i)&&T[i].name.toLowerCase().includes(st.q.toLowerCase()));
 ids.sort((a,b)=>T[a].name.localeCompare(T[b].name,'ru'));
 let h=`<div class="bar"><button id="pw" title="Неделя назад">«</button><button id="pv">‹</button><input type="date" id="dt" value="${st.date}" min="${START}" max="${END}"><button id="nx">›</button><button id="nw" title="Неделя вперёд">»</button><button id="td">Сегодня</button>
 <select id="cat"><option value="">Все категории</option>${[...new Set(T.flatMap(t=>t.cats))].map(c=>`<option ${c===st.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
 <input id="q" placeholder="Поиск по фамилии" value="${esc(st.q)}"><label><input type="checkbox" id="all" ${st.all?'checked':''}> показать и свободных</label></div>
 <h2 style="font-size:16px;margin:4px 0 8px">${dstr(st.date)}<span class="mut">${pl(st.date)}</span></h2>`;
 if(HOL[st.date])h+=`<div class="note">${HOL[st.date]}</div>`;
 else if(dow(st.date)===6&&!ids.length)h+=`<div class="note">В субботу у этих преподавателей занятий нет.</div>`;
 if(!ids.length){return h+`<p class="mut">Нет занятий по выбранным условиям.</p>`}
 h+=`<div class="wrap"><table><tr><th>Преподаватель</th>${slots.map(s=>`<th>${slot(s)}</th>`).join('')}</tr>`;
 for(const i of ids){h+=`<tr><td>${esc(T[i].name)}<small class="em">${T[i].email?'<a href="mailto:'+esc(T[i].email)+'">'+esc(T[i].email)+'</a>':'e-mail не указан'}</small></td>`;for(const s of slots){const c=ls.filter(l=>l.t===i&&l.s===s);
  const bad=new Set(c.map(l=>l.sub)).size>1;h+=`<td data-t="${slot(s)}" class="${bad?'cf':''}">${bad?'<b style="color:var(--warn)">⚠ накладка</b>':''}${c.length?c.map(lesson).join(''):'<span class="win">окно</span>'}</td>`}h+='</tr>'}
 return h+'</table></div>'}
function viewTch(){
 const cnt=T.map((_,i)=>0);const from=st.from==='today'?clamp(today):START;
 const days=Object.keys(IDX).filter(d=>d>=from);const rows=[];let tot=0;
 for(const d of days){const c=IDX[d].filter(l=>l.t===st.tch).sort((a,b)=>a.s-b.s);if(c.length){rows.push([d,c]);tot+=c.length}}
 const t=T[st.tch];
 let h=`<div class="bar"><select id="tc">${T.map((x,i)=>`<option value="${i}" ${i===st.tch?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <select id="fr"><option value="today" ${st.from==='today'?'selected':''}>С сегодняшнего дня</option><option value="all" ${st.from==='all'?'selected':''}>Весь семестр</option></select><button id="cp">Копировать текстом</button></div>
 <p><b>${esc(t.name)}</b> <span class="mut">· ${esc(t.cats.join(', '))}${t.email?' · <a href="mailto:'+esc(t.email)+'">'+esc(t.email)+'</a>':' · e-mail не указан'}</span><br><span class="mut">Дней с занятиями: ${rows.length}, пар: ${tot}</span></p>`;
 if(!rows.length)return h+`<p class="mut">В выбранном периоде занятий в расписании нет.</p>`;
 for(const[d,c]of rows){h+=`<div class="day"><h3><span>${dstr(d)}</span><span class="badge">${pl(d).replace(' · ','')||'суббота'}</span></h3>`+c.map(l=>`<div class="row"><div class="tm">${slot(l.s)}</div><div>${esc(l.sub)}<small class="mut" style="display:block">${esc(l.g)}${l.r?' · ауд. '+esc(l.r):''}</small></div></div>`).join('')+'</div>'}
 st._rows=rows;return h}
function render(){document.getElementById('t-day').className=st.tab==='day'?'on':'';document.getElementById('t-tch').className=st.tab==='tch'?'on':'';
 const a=document.getElementById('app');a.innerHTML=st.tab==='day'?viewDay():viewTch();bind()}
const $=id=>document.getElementById(id);
function shift(k){const d=toD(st.date);d.setUTCDate(d.getUTCDate()+k);st.date=clamp(isoU(d));render()}
function bind(){
 if($('pv')){$('pw').onclick=()=>shift(-7);$('nw').onclick=()=>shift(7);$('pv').onclick=()=>shift(-1);$('nx').onclick=()=>shift(1);$('td').onclick=()=>{st.date=clamp(today);render()};
  $('dt').onchange=e=>{if(e.target.value){st.date=clamp(e.target.value);render()}};$('cat').onchange=e=>{st.cat=e.target.value;render()};
  $('all').onchange=e=>{st.all=e.target.checked;render()};
  $('q').oninput=e=>{st.q=e.target.value;const p=e.target.selectionStart;render();const q=$('q');q.focus();q.setSelectionRange(p,p)}}
 if($('tc')){$('tc').onchange=e=>{st.tch=+e.target.value;render()};$('fr').onchange=e=>{st.from=e.target.value;render()};
  $('cp').onclick=async()=>{const txt=T[st.tch].name+'\n\n'+st._rows.map(([d,c])=>dstr(d)+pl(d)+'\n'+c.map(l=>'  '+slot(l.s)+'  '+l.sub+(l.g?' ['+l.g+']':'')).join('\n')).join('\n\n');
   try{await navigator.clipboard.writeText(txt);$('cp').textContent='Скопировано ✓'}catch(e){$('cp').textContent='Не удалось скопировать'}}}}
$('t-day').onclick=()=>{st.tab='day';render()};$('t-tch').onclick=()=>{st.tab='tch';render()};

build();render();
</script></body></html>
